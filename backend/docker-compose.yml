services:
  postgres:
    image: postgres:17-alpine
    container_name: campaign-notes-postgres
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign_notes
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campaign -d campaign_notes']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
